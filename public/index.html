<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Collector</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2230; --muted:#667085; --line:#e3e6ec; --accent:#2a6df4; --ok:#1a9d5c; --warn:#d98a00; --bad:#d6342c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12151c; --panel:#1b1f2a; --text:#e6e9f0; --muted:#98a2b3; --line:#2b3140; --accent:#6c9cff; --ok:#3ccf8a; --warn:#f0b13b; --bad:#ff6b63; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  header { padding:14px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; } h2 { font-size:13px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  main { padding:0 16px 24px; display:grid; gap:12px; max-width:1200px; margin:auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile .v { font-size:22px; font-weight:600; } .tile .l { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr.row { cursor:pointer; } tr.row:hover { background:var(--bg); }
  input,select,button { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); } button.alt { background:var(--panel); color:var(--text); border-color:var(--line); }
  .form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:center; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); }
  .wf { position:relative; } .wfrow { display:flex; align-items:center; height:24px; } .wfname { width:230px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .wftrack { position:relative; flex:1; height:16px; background:var(--bg); border-radius:3px; } .bar { position:absolute; top:2px; height:12px; border-radius:3px; background:var(--accent); min-width:2px; } .bar.err { background:var(--bad); }
  .cfg { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:6px 12px; } .cfg label { display:flex; justify-content:space-between; gap:6px; font-size:12px; align-items:center; } .cfg input { width:90px; }
  .err-text { color:var(--bad); white-space:pre-wrap; } .muted { color:var(--muted); font-size:12px; }
  @media (max-width:600px) { .wfname { width:110px; } }
</style>
</head>
<body>
<header><h1>Telemetry Collector</h1><span class="muted">Group 21 · services: gateway, search, availability, booking, payment, notification (railway names; HLD: frontend/user/order/payment/notification)</span></header>
<main>
  <section class="panel"><h2>Live metrics</h2><div class="tiles" id="tiles"></div></section>
  <section class="panel"><h2>Kept by reason</h2><div class="tiles" id="reasons"></div></section>
  <section class="panel"><h2>Fault switches</h2><div class="form" id="faults"></div></section>
  <section class="panel">
    <h2>Trace search</h2>
    <form class="form" id="search">
      <select name="status"><option value="">any status</option><option>OK</option><option>ERROR</option></select>
      <select name="reason"><option value="">any reason</option><option>ERROR</option><option>HIGH_LATENCY</option><option>INCOMPLETE</option><option>NORMAL_SAMPLED</option></select>
      <input name="service" placeholder="service">
      <input name="min_duration_ms" placeholder="min ms" size="7">
      <input name="id" placeholder="trace id">
      <label class="muted"><input type="checkbox" name="include_archived"> archived</label>
      <button>Search</button>
    </form>
    <table><thead><tr><th>trace</th><th>status</th><th>reason</th><th>root</th><th>ms</th><th>spans</th><th></th></tr></thead><tbody id="results"></tbody></table>
    <button class="alt" id="more" hidden>Load more</button>
  </section>
  <section class="panel"><h2>Waterfall <span class="muted" id="wfinfo"></span></h2><div class="wf" id="wf"><span class="muted">Select a trace.</span></div></section>
  <section class="panel"><h2>Config <span class="muted" id="cfgver"></span></h2><div class="cfg" id="cfg"></div><p><button id="cfgsave">Apply changes</button> <span class="err-text" id="cfgerr"></span></p></section>
</main>
<script>
'use strict';
// All server-provided strings are rendered with textContent (never innerHTML) — E58.
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const j = async (url, opts) => { const r = await fetch(url, opts); return { status: r.status, body: await r.json().catch(() => ({})) }; };

function tile(parent, label, value, cls) {
  const t = el('div', undefined, 'tile'); t.append(el('div', String(value ?? '–'), 'v ' + (cls || '')), el('div', label, 'l')); parent.append(t);
}

async function refresh() {
  try {
    const { body: m } = await j('/metrics');
    const t = $('tiles'); t.replaceChildren();
    tile(t, 'ingest spans/s', m.ingestion.ingest_rate_per_sec);
    tile(t, 'queue depth', m.queue.queue_depth);
    tile(t, 'queue state', m.queue.queue_state, m.queue.queue_state === 'NORMAL' ? 'ok' : m.queue.queue_state === 'SOFT' ? 'warn' : 'bad');
    tile(t, 'open traces', m.aggregation.open_traces);
    tile(t, 'breaker', m.batching.breaker_state, m.batching.breaker_state === 'closed' ? 'ok' : 'bad');
    tile(t, 'pending batches', m.batching.pending_batches);
    tile(t, 'p95 finalize→stored ms', m.storage.finalize_to_stored_ms.p95);
    tile(t, 'hot traces', m.storage.hot_trace_count);
    tile(t, 'archived', m.archive.archived_traces);
    tile(t, 'duplicates', m.aggregation.duplicate_spans);
    tile(t, 'late spans', m.aggregation.late_spans);
    tile(t, 'rejected (429)', m.ingestion.rejected_spans);
    tile(t, 'dropped traces', m.sampling.dropped_total);
    const r = $('reasons'); r.replaceChildren();
    for (const [k, v] of Object.entries(m.sampling.kept_by_reason)) tile(r, k, v);
    $('cfgver').textContent = 'v' + m.config_version;
  } catch { /* collector down; keep polling */ }
}

// ---- faults
const FAULTS = ['storage_down', 'archive_down', 'slow_drain'];
async function loadFaults() {
  const { body } = await j('/v1/faults'); const box = $('faults'); box.replaceChildren();
  for (const f of FAULTS) {
    const b = el('button', f + ': ' + (body.faults[f] ? 'ON' : 'off'), body.faults[f] ? '' : 'alt');
    b.onclick = async () => { await j('/v1/faults', { method: 'PUT', headers: hdr(), body: JSON.stringify({ [f]: !body.faults[f] }) }); loadFaults(); };
    box.append(b);
  }
}
const hdr = () => ({ 'content-type': 'application/json', ...(localStorage.adminToken ? { 'X-Admin-Token': localStorage.adminToken } : {}) });

// ---- search
let cursor = null, lastParams = null;
function row(tr) {
  const r = el('tr', undefined, 'row');
  r.append(el('td', tr.trace_id), el('td', tr.status || '', tr.status === 'ERROR' ? 'bad' : ''), el('td', tr.sample_reason || tr.tier || ''), el('td', tr.root_service || ''), el('td', tr.duration_ms), el('td', tr.span_count ?? ''));
  const td = el('td'); if (tr.is_complete === false) td.append(el('span', 'incomplete', 'badge warn')); r.append(td);
  r.onclick = () => showTrace(tr.trace_id);
  return r;
}
async function search(append) {
  const f = new FormData($('search')); const p = new URLSearchParams();
  if (!append) { for (const [k, v] of f) if (v && k !== 'id') p.set(k, v); lastParams = p; cursor = null; } else { for (const [k, v] of lastParams) p.set(k, v); }
  if (!append && f.get('id')) { showTrace(f.get('id').trim()); }
  if (cursor) p.set('cursor', cursor);
  p.set('limit', '25');
  const { status, body } = await j('/v1/traces?' + p);
  const tb = $('results'); if (!append) tb.replaceChildren();
  if (status !== 200) { tb.append(el('tr')).append(el('td', JSON.stringify(body))); return; }
  for (const it of body.items) tb.append(row(it));
  for (const it of body.archived || []) tb.append(row(it));
  cursor = body.next_cursor; $('more').hidden = !cursor;
}
$('search').onsubmit = (e) => { e.preventDefault(); search(false); };
$('more').onclick = () => search(true);

// ---- waterfall (visited set protects against parent cycles — E18)
async function showTrace(id) {
  const { status, body } = await j('/v1/traces/' + encodeURIComponent(id));
  const wf = $('wf'); wf.replaceChildren();
  if (status !== 200) { wf.append(el('span', status + ' ' + JSON.stringify(body), 'err-text')); return; }
  const trace = body.trace, spans = trace.spans;
  $('wfinfo').textContent = `${trace.trace_id} · source=${body.source} · ${trace.sample_reason || 'n/a'} · ${trace.duration_ms} ms${trace.is_complete ? '' : ' · INCOMPLETE'}`;
  const t0 = Math.min(...spans.map((s) => s.start_time)), total = Math.max(1, Math.max(...spans.map((s) => s.end_time)) - t0);
  const byId = new Map(spans.map((s) => [s.span_id, s])); const kids = new Map(); const roots = [];
  for (const s of spans) { if (s.parent_span_id && byId.has(s.parent_span_id)) { (kids.get(s.parent_span_id) || kids.set(s.parent_span_id, []).get(s.parent_span_id)).push(s); } else roots.push(s); }
  const seen = new Set();
  const draw = (s, depth) => {
    if (seen.has(s.span_id)) return; seen.add(s.span_id);
    const r = el('div', undefined, 'wfrow'); const name = el('div', ' '.repeat(depth * 3) + s.service + ' · ' + s.operation, 'wfname'); name.title = s.service + ' ' + s.operation;
    const track = el('div', undefined, 'wftrack'); const bar = el('div', undefined, 'bar' + (s.status === 'ERROR' ? ' err' : ''));
    bar.style.left = ((s.start_time - t0) / total * 100) + '%'; bar.style.width = Math.max(0.3, (s.end_time - s.start_time) / total * 100) + '%'; bar.title = `${s.end_time - s.start_time} ms`;
    track.append(bar); r.append(name, track, el('span', ' ' + (s.end_time - s.start_time) + ' ms', 'muted')); wf.append(r);
    for (const c of kids.get(s.span_id) || []) draw(c, depth + 1);
  };
  for (const r of roots) draw(r, 0);
  for (const s of spans) draw(s, 0); // cycle members with no root
}

// ---- config editor
let cfgNow = {};
async function loadCfg() {
  const { body } = await j('/v1/config'); cfgNow = body.config; const box = $('cfg'); box.replaceChildren();
  for (const [k, v] of Object.entries(cfgNow)) {
    const l = el('label', k); const i = el('input'); i.name = k; i.value = v; i.dataset.type = typeof v; l.append(i); box.append(l);
  }
}
$('cfgsave').onclick = async () => {
  const patch = {};
  for (const i of $('cfg').querySelectorAll('input')) {
    const v = i.dataset.type === 'boolean' ? i.value === 'true' : i.dataset.type === 'number' ? (i.value.trim() === '' ? NaN : Number(i.value)) : i.value;
    if (v !== cfgNow[i.name]) patch[i.name] = Number.isNaN(v) ? i.value : v;
  }
  const { status, body } = await j('/v1/config', { method: 'PUT', headers: hdr(), body: JSON.stringify(patch) });
  $('cfgerr').textContent = status === 200 ? 'applied (version ' + body.version + ')' : (body.errors || []).map((e) => e.field + ': ' + e.reason).join('\n') || JSON.stringify(body);
  loadCfg();
};

refresh(); loadFaults(); loadCfg(); search(false);
setInterval(refresh, 2000);
</script>
</body>
</html>
